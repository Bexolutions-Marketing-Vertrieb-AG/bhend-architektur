# Binflow surface inventory (v1). Locators use componentId / section id, never sections[] index.
# @see docs/template/BSI.md
version: 1
project_key: bhend-architektur
surfaces:
  - bf_id: home.welcome.shell
    kind: container
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/setup/sections/SectionWelcome
    locales: [de]
    publication_target: orbitype_pages
    sample: ""
    notes: "Operator setup page shell — declare-only"

  - bf_id: home.welcome.heading
    kind: style_target
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/setup/sections/SectionWelcome/title@de
    locales: [de]
    publication_target: orbitype_pages
    sample: "Willkommen bei Ihrer Astro + Orbitype Site"

  - bf_id: home.welcome.body
    kind: style_target
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/setup/sections/SectionWelcome/lead@de
    locales: [de]
    publication_target: orbitype_pages
    sample: "Dieser Bildschirm erscheint, wenn das CMS leer, nicht konfiguriert oder im Mock-Modus ist."

  - bf_id: home.hero.shell
    kind: container
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero
    locales: [de]
    publication_target: orbitype_pages
    sample: ""

  - bf_id: home.hero.heading
    kind: style_target
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/title@de
    locales: [de]
    publication_target: orbitype_pages
    sample: "BHEND ARCHITEKTUR"

  - bf_id: home.hero.body
    kind: style_target
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/lead@de
    locales: [de]
    publication_target: orbitype_pages
    sample: "Bauen für Menschen, gestalten für Generationen"

  - bf_id: home.hero.image
    kind: image
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/image@de
    locales: [de]
    publication_target: orbitype_pages
    sample: /images/home/hero.jpg
    alt_locator: orbitype:pages/home/sections/SectionHero/imageAlt@de

  - bf_id: home.hero.cta
