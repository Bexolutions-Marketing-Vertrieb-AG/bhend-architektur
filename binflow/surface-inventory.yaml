    section: nav
    path: src/components/layout/Navigation.astro
    locator: orbitype:pages/home/sections/Navigation
    locales: [de]
    publication_target: orbitype_pages
    sample: ""
    notes: "Layout chrome — declare-only"

  - bf_id: chrome.nav.cta
    kind: chrome_denied
    area: chrome
    section: nav
    path: src/components/layout/Navigation.astro
    locator: orbitype:pages/home/sections/Navigation/ctaLabel@de
    locales: [de]
