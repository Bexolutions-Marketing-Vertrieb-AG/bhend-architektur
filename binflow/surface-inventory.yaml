# Binflow surface inventory (v1). Clones: set project_key; keep bf_ids stable.
# Locators use componentId (Section*), never sections[] index.
# @see docs/template/BSI.md
version: 1
project_key: orbitype-astro-template
surfaces:
  - bf_id: home.welcome.shell
    kind: container
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/home/sections/SectionWelcome
    locales: [en]
    publication_target: orbitype_pages
    sample: ""
    notes: "Default mock/seed Home shell — declare-only"

  - bf_id: home.welcome.heading
    kind: style_target
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/home/sections/SectionWelcome/title@en
    locales: [en]
    publication_target: orbitype_pages
    sample: "Welcome to your Astro + Orbitype site"

  - bf_id: home.welcome.body
    kind: style_target
    area: home
    section: welcome
    path: src/components/sections/SectionWelcome.astro
    locator: orbitype:pages/home/sections/SectionWelcome/lead@en
    locales: [en]
    publication_target: orbitype_pages
    sample: "This screen appears when the CMS is empty, unconfigured, or running in mock mode."

  - bf_id: home.hero.shell
    kind: container
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero
    locales: [en]
    publication_target: orbitype_pages
    sample: ""
    notes: "Optional marketing Home hero when seed replaces welcome"

  - bf_id: home.hero.heading
    kind: style_target
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/title@en
    locales: [en]
    publication_target: orbitype_pages
    sample: "Headline"

  - bf_id: home.hero.body
    kind: style_target
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/lead@en
    locales: [en]
    publication_target: orbitype_pages
    sample: "Lead text"

  - bf_id: home.hero.image
    kind: image
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/img@en
    locales: [en]
    publication_target: orbitype_pages
    sample: ""

  - bf_id: home.hero.cta
    kind: chrome_denied
    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/ctaLabel@en
    locales: [en]
    publication_target: orbitype_pages
    sample: "Get started"
    notes: "CTA label; href via ctaHref sibling field"
