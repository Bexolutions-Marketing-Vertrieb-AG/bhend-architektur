    area: home
    section: hero
    path: src/components/sections/SectionHero.astro
    locator: orbitype:pages/home/sections/SectionHero/ctaLabel@de
    locales: [de]
    publication_target: orbitype_pages
    sample: ""
    notes: "Optional CTA; href via reservationMode/reservationTarget or ctaHref"

  - bf_id: home.audience.shell
    kind: container
    area: home
    section: audience
    path: src/components/sections/SectionIconGrid.astro
    locator: orbitype:pages/home/sections/audience
    locales: [de]
    publication_target: orbitype_pages
    sample: ""

  - bf_id: home.challenges.shell
    kind: container
    area: home
    section: challenges
    path: src/components/sections/SectionSplit.astro
    locator: orbitype:pages/home/sections/challenges
    locales: [de]
    publication_target: orbitype_pages
    sample: ""

  - bf_id: home.challenges.heading
    kind: style_target
    area: home
    section: challenges
    path: src/components/sections/SectionSplit.astro
    locator: orbitype:pages/home/sections/challenges/heading@de
    locales: [de]
    publication_target: orbitype_pages
    sample: "Private und Öffentliche Bauprojekte ="

  - bf_id: home.challenges.body
    kind: style_target
    area: home
    section: challenges
